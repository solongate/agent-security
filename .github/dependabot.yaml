version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: gomod
    directory: /packages/guard
    schedule:
      interval: weekly
    groups:
      go:
        patterns: ['*']

  - package-ecosystem: gomod
    directory: /packages/app
    schedule:
      interval: weekly
    groups:
      go:
        patterns: ['*']

  - package-ecosystem: gomod
    directory: /packages/policy
    schedule:
      interval: weekly
    groups:
      go:
        patterns: ['*']

  - package-ecosystem: gomod
    directory: /packages/shared
    schedule:
      interval: weekly
    groups:
      go:
        patterns: ['*']

  - package-ecosystem: gomod
    directory: /packages/core
    schedule:
      interval: weekly
    groups:
      go:
        patterns: ['*']

  - package-ecosystem: gomod
    directory: /packages/cli
    schedule:
      interval: weekly
    groups:
      go:
        patterns: ['*']

  - package-ecosystem: gomod
    directory: /packages/tui
    schedule:
      interval: weekly
    groups:
      go:
        patterns: ['*']