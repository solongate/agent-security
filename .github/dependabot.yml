version: 2

# The guard runs before every tool call, so a dependency on the decision path is
# a liability rather than a convenience. sgshared deliberately has none, and
# sgpolicy has one that matters (OPA). Updates are grouped per module so a bump
# arrives as one pull request to review rather than four.
#
# Review them by hand. There is no conformance suite behind these any more, so
# a green tick on a dependency bump means it compiles, not that the guard still
# decides the way it did before.

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  # ONE npm ENTRY, NOT TWO. There used to be a second for /packages/proxy, and in a
  # pnpm workspace the root entry already resolves every member's manifest, so
  # each bump arrived twice: "Bump ink" and "Bump ink in /packages/proxy", two
  # branches, two full CI runs, two things to review that were the same thing.
  # Three of seven open pull requests were the duplicate half.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-tooling:
        dependency-type: development
        patterns: ['*']

  - package-ecosystem: gomod
    directory: /packages/guard-go
    schedule:
      interval: weekly
    groups:
      go:
        patterns: ['*']

  - package-ecosystem: gomod
    directory: /packages/proxy-go
    schedule:
      interval: weekly
    groups:
      go:
        patterns: ['*']

  - package-ecosystem: gomod
    directory: /packages/sgpolicy
    schedule:
      interval: weekly
    groups:
      go:
        patterns: ['*']

  - package-ecosystem: gomod
    directory: /packages/sgshared
    schedule:
      interval: weekly
    groups:
      go:
        patterns: ['*']
