name: ci

# WHAT THESE JOBS DO NOT DO: decide whether the guard is correct.
#
# The conformance suite was the contract. It ran twice, once against the Node
# hook and once against the Go binary, and it was the only thing in the
# repository that compared the two implementations to each other. It has been
# removed, along with every Go test, and nothing took its place.
#
# So read the green tick for what it now means: the Go code is formatted, it
# vets, it compiles, the hooks bundle, the release script runs, and no secret is
# committed. Whether a tool call that should be refused gets refused is not
# among the things anything here asks.
#
# There is no TypeScript job either, because there is no TypeScript left to
# check. The CLI and the TUI were removed once the Go port replaced them and
# distribution stopped going through npm. What remains in packages/hooks is
# .mjs hook programs, which run under node and are typechecked by nothing.
#
# Three jobs used to live here and do not any more: the schema applied to a real
# PostgreSQL and a real SQLite, and a real Keycloak signed a device in end to end.
# Each of them caught something real. They went with the server they tested.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    name: go (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - packages/guard
          - packages/policy
          - packages/shared
          - packages/sandbox
          - packages/core
          - packages/cli
          - packages/tui
          - packages/app

  # THE PLATFORM-SPECIFIC FILES WERE NEVER COMPILED BY ANYTHING, which is the
  # gap this job exists to close.
  #
  # Three packages carry per-platform code behind build tags: sandbox has a
  # Landlock file, a Seatbelt file, an icacls file and a refuse-everything
  # fallback; guard and core/install each had a pair. Every CI job ran on
  # ubuntu-latest, so the darwin and windows halves were checked by nothing at
  # all, the Seatbelt profile and the Windows deny were as good as whatever
  # somebody last typed into them. Cross-compiling here is cheap and catches the
  # whole class: an undefined symbol, a syscall that does not exist on that GOOS,
  # a constant renamed on one side of a tag.
  #
  # IT DOES NOT RUN ANYTHING, and the job name says compile for that reason.
  # Landlock needs a Linux kernel, the closed box needs a mount namespace, and
  # Seatbelt needs a Mac, so this proves the code builds for those platforms
  # and nothing about whether the confinement holds there. The honest version of
  # that is in the package comments, which say which platform has been measured.
  cross:
    name: compile (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [darwin, windows, linux]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: packages/guard/go.mod
          cache-dependency-path: packages/guard/go.sum

      - name: build every module for this platform
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          # CGO off, which is what the release build uses too: there is no
          # per-platform toolchain to install and nothing links libc.
          CGO_ENABLED: '0'
        run: |
          for m in guard policy shared sandbox core cli tui app; do
            echo "== packages/$m"
            (cd "packages/$m" && go build ./...)
          done

      # vet understands build tags, so running it per GOOS is what actually
      # reads the file that platform compiles. One pass on linux reads the
      # linux file and skips the other three.
      - name: vet for this platform
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          for m in guard policy shared sandbox core cli tui app; do
            (cd "packages/$m" && go vet ./...)
          done
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # THE VERSION THE MODULE DECLARES, not a number typed into three files.
      #
      # OPA 1.21.1 requires go 1.26, so taking it raised the `go` line in
      # guard and policy while this pin stayed at 1.25. setup-go sets
      # GOTOOLCHAIN=local, so `go vet` refused to run rather than fetching what
      # it needed, and every laptop with a newer toolchain built the same tree
      # without a word. Reading go.mod is how the pin stops being able to drift
      # from the thing it pins.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.sum

      # gofmt before the tests: a formatting failure is cheap to find and
      # reading a diff is not what a reviewer should spend attention on.
      - name: gofmt
        working-directory: ${{ matrix.module }}
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt'd:"; echo "$unformatted"
            gofmt -d $unformatted
            exit 1
          fi

      - name: vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...

      # THE TESTS, which this job did not have a step for until there were any.
      #
      # The comment here used to explain the absence: the 56 _test.go files these
      # modules once had were removed, so `go test ./...` would have reported "no
      # test files" for every package and passed without looking at anything, and
      # a check that cannot fail reads as coverage.
      #
      # There are tests now, and they are deliberately only the things a pure
      # function can answer: which view count a DLP scan uses, which directories
      # the two Landlock regimes grant, what the tamper layer matches and what it
      # leaves alone, how a rule with no toolPattern compiles, which sandbox slot
      # is next. End to end behaviour stays in the check scripts, where it needs
      # a kernel and two real binaries.
      #
      # -count=1 defeats the build cache. A cached PASS from an earlier commit is
      # not a measurement of this one.
      #
      # Modules with no test files are not an error: this runs over eight and
      # five of them have tests. `go test ./...` prints "no test files" and exits
      # zero, which is the honest report.
      - name: test
        working-directory: ${{ matrix.module }}
        run: go test -count=1 ./...

      # AND ONE TEST THAT NEEDS CAPABILITIES NOBODY HAS ON A LAPTOP.
      #
      # The two-regime grant rests on an immutable inode flag, and setting one
      # needs CAP_LINUX_IMMUTABLE. The end-to-end case skips itself for an
      # ordinary user, which means the thing the whole feature depends on would
      # be proved nowhere. A runner can sudo without a password, so it is proved
      # here: the flag is set, the write is refused by the kernel, and the grant
      # widens only then.
      #
      # Linux only, and only the module that has such a test.
      - name: test (as root, for the immutable-flag cases)
        if: matrix.module == 'packages/sandbox'
        working-directory: ${{ matrix.module }}
        run: sudo -E env "PATH=$PATH" go test -count=1 -run Frozen -v ./...

  # THE CHECKS THIS REPOSITORY HAS, run rather than committed and forgotten.
  #
  # These are the END TO END half, and the Go tests in the job above are the
  # other. The split is by instrument rather than by taste: a shell check drives
  # two real binaries through real policy files on a real kernel, which is the
  # only way to answer "do the two implementations agree" and "is the box
  # closed", and it cannot reach a function. A Go test can reach a function and
  # cannot start a mount namespace.
  #
  # The division has already paid once. The divergence that cost the most this
  # round, an argument scan reading one view of the text where its twin read
  # three, was invisible to fourteen end-to-end cases and is one line in a unit
  # test. The box being closed is invisible to any unit test and is twenty-two
  # questions here.
  #
  # All three work on a runner, which is why this job can exist. The parity and
  # layers checks build the guard and need the hook bundle, both of which CI
  # already does. The box check needs bwrap and a shell that is not itself
  # confined, and a GitHub runner is both.
  #
  # WHAT EACH ONE ANSWERS, because they are three different questions:
  #
  #   parity  do the two implementations reach the same verdict?
  #   layers  do the enforcement layers do what they claim?
  #   box     is the closed box actually closed?
  #
  # Parity was here first and only ever asked the first question: fourteen cases,
  # every one of them "go and js agree". Two implementations agreeing says
  # nothing about whether either is right, and for a while that was the whole of
  # what ran. The layers check is the second question, and writing it found the
  # seventh divergence on its first run: the Go argument scan read one view of
  # the text where the Node one read three, so a secret split across a quote
  # boundary was refused by one guard and allowed by the other.
  #
  # STILL NOT A TEST SUITE. Forty cases is more than fourteen and neither number
  # is coverage. What they catch is the class that has cost the most here: the
  # two implementations drifting apart, a layer that is configured but inert, and
  # a sandbox that reports confinement it is not applying.
  checks:
    name: checks (parity, layers, box)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          # The same literal the other jobs use. package.json says ">=22.0.0",
          # which is a range rather than a version, and setup-node does not
          # resolve one.
          node-version: '22'
          cache: pnpm

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: packages/guard/go.mod
          cache-dependency-path: packages/guard/go.sum

      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm build

      # The closed box is built with bubblewrap, and a refusal naming the
      # package is what a machine without it gets. Installing it here is what
      # makes the box check able to answer rather than skip.
      - name: bubblewrap
        run: sudo apt-get update && sudo apt-get install -y bubblewrap

      # Landlock has to be in the kernel for the parity check's protected-path
      # cases to mean anything. Printed rather than asserted: the runner image
      # decides, and a skipped reason in the log beats a green tick that proved
      # nothing.
      - name: what this kernel can do
        run: |
          echo "kernel: $(uname -r)"
          echo "landlock in lsm: $(cat /sys/kernel/security/lsm 2>/dev/null || echo unknown)"
          echo "userns: $(cat /proc/sys/user/max_user_namespaces 2>/dev/null || echo unknown)"

      # Fourteen cases: both guards judged against the same policy file, on
      # protected paths, require-sandbox, agent scoping, the .last-deny flag and
      # the version handshake. A divergence here is the bug this repository keeps
      # finding, so it fails the build.
      - name: the two guards agree
        run: ./.sg-parity-check.sh

      # Twenty-six cases driving both guards through every layer that refuses
      # something: DLP in all four modes and on file content, the rate limit,
      # tamper protection with no policy loaded at all, the four policy
      # constraint kinds, whitelist mode, and a project-local policy file trying
      # to turn tamper off. Each case asserts the same exit code from both
      # implementations, so it is a parity check and a behaviour check at once.
      - name: the layers enforce
        run: ./.sg-layers-check.sh

      # Twenty-two questions about a closed box: what is absent, what still
      # works, the per-box network answer, and whether an unknown id is refused.
      - name: the box closes
        run: ./.sg-box-check.sh

  # THE SEATBELT HALF, on a machine that has Seatbelt.
  #
  # packages/sandbox carries four platform files and until now one of them was
  # measured. The cross job proves the darwin file compiles; compiling is not
  # confining, and a profile that `sandbox-exec` accepts and then enforces
  # nothing would pass it. The Seatbelt file's own header admits the mechanism is
  # deprecated with no removal date and is still the only option, which is
  # exactly the kind of thing that stops working quietly.
  #
  # So this runs `solongate run` on a Mac and asks it the questions the Linux
  # side is already asked: can the agent read the protected file, write it,
  # delete it, reach it through a symlink or a script it wrote, and do the
  # ordinary things that have to keep working.
  #
  # The closed box is not covered and cannot be: it is a Linux mount namespace,
  # macOS has no equivalent, and `solongate sandbox` refuses here. The last case
  # checks that it refuses with a reason rather than running something weaker.
  seatbelt:
    name: seatbelt (macos)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: packages/app/go.mod
          cache-dependency-path: packages/app/go.sum

      - name: what this machine can do
        run: |
          echo "macos: $(sw_vers -productVersion)"
          echo "sandbox-exec: $(command -v sandbox-exec || echo MISSING)"

      - name: the profile confines
        run: ./.sg-seatbelt-check.sh

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # No `version` input: package.json's `packageManager` field is the one
      # source, and action-setup v4 REFUSES when both are set rather than
      # picking one. That refusal is what failed the two pnpm jobs on the first
      # run, five seconds in, before pnpm existed to report anything.
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts

      # This bundles hooks/guard.mjs into hooks/guard.bundled.mjs, which is
      # the file that installs as the guard: readGuard prefers it, with its
      # sibling policy-eval.mjs inlined. The unbundled hook imports that
      # sibling by relative path, and whether it resolves on a stranger's
      # machine is not a thing to find out on the decision path.
      - name: build
        working-directory: packages/hooks
        run: pnpm build

      # THE RELEASE BUILD, which nothing here exercised until it was broken.
      #
      # This is the script that produces what users install, and it spent an
      # unknown number of weeks unable to build this repository at all: it built
      # a third program from a module that is not in the tree, and spawnSync
      # reports a missing `cwd` as ENOENT on the COMMAND, so the failure read as
      # "no Go toolchain" on machines that had one. Every job above was green
      # throughout.
      #
      # One target, not six. Six takes minutes and proves nothing more about the
      # script.
      #
      # go.mod rather than a pinned number, for the reason given above the
      # matrix.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: packages/guard/go.mod
          cache-dependency-path: packages/guard/go.sum
      - name: the release build works
        working-directory: packages/hooks
        run: pnpm build:go linux-x64

      # AND THAT IT CHANGED NOTHING IT SHOULD NOT HAVE.
      #
      # build:go used to rewrite six optionalDependencies into
      # packages/hooks/package.json, each pinned to a version that was never
      # published. pnpm cannot record an optional dependency it cannot resolve,
      # so the lockfile never held them, and `pnpm install --frozen-lockfile`
      # could not pass on any machine. It failed every CI run and every release
      # job, which is why five pushed tags produced no releases at all.
      #
      # Know what this is worth: it fires only if the script starts writing to
      # the tree again. The check that asserted the lockfile and every manifest
      # agree, which is the property that was actually broken, lived in the
      # conformance suite and went with it.
      - name: the build left the tree alone
        run: |
          if ! git diff --exit-code -- packages/hooks/package.json pnpm-lock.yaml; then
            echo
            echo "build:go modified a manifest or the lockfile, which it must not do."
            exit 1
          fi

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The whole history. A secret that was committed and then removed is
          # still a secret, and scanning only the tip would miss every one of
          # them.
          fetch-depth: 0

      # THE BINARY, NOT gitleaks/gitleaks-action@v2.
      #
      # The action refuses to run for an organisation without a paid licence:
      # "[solongate] is an organization. License key is required." It cost
      # nothing while this repository belonged to a person and started failing
      # the moment it moved, with no change to the code it scans.
      #
      # gitleaks itself is MIT and free. Only the wrapper is licensed, so the
      # wrapper is what goes.
      #
      # PINNED AND VERIFIED. A step that downloads a binary and runs it over the
      # whole repository is a supply chain, and a security scan that could be
      # swapped underneath us is worth less than no scan: it would still report
      # green. The version is fixed and the checksum is checked before the file
      # is allowed to execute.
      - name: gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" gitleaks

          # `git` rather than `detect`: 8.19 deprecated detect and hid it from
          # --help. It still runs today and will not forever.
          #
          # --redact so a finding names the rule and the file without printing
          # the secret into a public build log, which is the one place a leak
          # gets worse by being reported.
          ./gitleaks git --config .gitleaks.toml --redact --exit-code 1 .
