name: ci

# Every job here corresponds to something that was found by running it rather
# than by reading the code. The conformance suite is the clearest: it is the
# contract the guard is judged against, and it runs TWICE — once against the Node
# hook and once against the Go binary — because which of the two decides a call
# depends only on whether a machine has the binary.
#
# Three jobs used to live here and do not any more: the schema applied to a real
# PostgreSQL and a real SQLite, and a real Keycloak signed a device in end to end.
# Each of them caught something real. They went with the server they tested.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    name: go (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - packages/proxy-go
          - packages/guard-go
          - packages/sgpolicy
          - packages/sgshared
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache-dependency-path: ${{ matrix.module }}/go.sum

      # gofmt before the tests: a formatting failure is cheap to find and
      # reading a diff is not what a reviewer should spend attention on.
      - name: gofmt
        working-directory: ${{ matrix.module }}
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt'd:"; echo "$unformatted"
            gofmt -d $unformatted
            exit 1
          fi

      - name: vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...

      # -count=1 defeats the test cache. A cached PASS is not evidence: a test whose
      # SUBJECT was deleted elsewhere in the repo — a Dockerfile, a config file, a
      # policy cache — keeps reporting the last run's result until something in its own
      # package changes. One did, for a while, and only surfaced when an unrelated edit
      # invalidated it. CI is the place that should never be reading a cache.
      - name: test
        working-directory: ${{ matrix.module }}
        run: go test -count=1 ./...

  typescript:
    name: typescript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # No `version` input: package.json's `packageManager` field is the one
      # source, and action-setup v4 REFUSES when both are set rather than
      # picking one. That refusal is what failed the two pnpm jobs on the first
      # run, five seconds in, before pnpm existed to report anything.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: typecheck
        working-directory: packages/proxy
        run: npx tsc --noEmit -p tsconfig.json

  conformance:
    name: guard conformance suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # No `version` input: package.json's `packageManager` field is the one
      # source, and action-setup v4 REFUSES when both are set rather than
      # picking one. That refusal is what failed the two pnpm jobs on the first
      # run, five seconds in, before pnpm existed to report anything.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts

      # The suite imports the BUILT javascript. Without this it fails to resolve a
      # module rather than reporting a test failure, which reads as the suite being
      # broken instead of unbuilt.
      #
      # THE FULL BUILD (`pnpm build`), not `npx tsc`. tsc emits one .js per source file, which resolves
      # every import the suite has and is NOT what ships: the package ships tsup's
      # bundles, and `clean: true` means dist afterwards holds only those. So CI was
      # certifying a layout no user ever gets — and the difference is not theoretical,
      # because a module the suite imports has to be an ENTRY to survive bundling. Two
      # of them were not, and the suite only noticed on a laptop that had run the real
      # build. This also produces the bundled hook the next step names.
      - name: build
        working-directory: packages/proxy
        run: pnpm build

      # SG_HOOK is set explicitly even though the suite now defaults to this same
      # bundled build. The default used to be the hook INSTALLED in the home
      # directory, which failed here (a runner has none) and passed on a laptop —
      # and later failed on a laptop whose installed copy was older than the fix
      # under test. Naming the file is how this job says WHICH hook it certifies.
      #
      # The bundled build is the one under test because it is the one that
      # ships: readGuard in global-install.ts prefers it, with opa-wasm inlined,
      # and writes it out as the installed hook.
      - name: run the suite
        env:
          SG_HOOK: ${{ github.workspace }}/packages/proxy/hooks/guard.bundled.mjs
        run: node packages/proxy/test/run-all.mjs

      # AND AGAIN AGAINST THE GO GUARD. The two implementations are deliberately
      # identical, and which one decides a call depends on whether a machine has
      # the binary — so certifying only one of them certifies half the machines.
      # This is the same suite, unchanged: the harness derives the launch from
      # what SG_HOOK is, a script needing an interpreter and a binary being one.
      #
      # It would not have run before now. tamper-path.mjs spawned `node $SG_HOOK`
      # itself, which handed an ELF file to node, and the failures that produced
      # read as the guard being broken.
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache-dependency-path: packages/guard-go/go.sum
      - name: build the go guard
        working-directory: packages/guard-go
        run: go build -o solongate-guard .
      - name: run the suite against the go guard
        env:
          SG_HOOK: ${{ github.workspace }}/packages/guard-go/solongate-guard
        run: node packages/proxy/test/run-all.mjs

      # THE RELEASE BUILD, which nothing here exercised until it was broken.
      #
      # `go build` above compiles the guard for this runner. It is not the script that
      # produces what users install, and that script spent an unknown number of weeks
      # unable to build this repository at all: it built a third program from a module
      # that is not in the tree, and spawnSync reports a missing `cwd` as ENOENT on the
      # COMMAND, so the failure read as "no Go toolchain" on machines that had one.
      # Every job above was green throughout.
      #
      # One target, not six. Six takes minutes and proves nothing more about the script.
      - name: the release build works
        working-directory: packages/proxy
        run: pnpm build:go linux-x64

      # AND THAT IT CHANGED NOTHING IT SHOULD NOT HAVE.
      #
      # build:go used to rewrite six optionalDependencies into
      # packages/proxy/package.json, and this step compared the file afterwards.
      # It no longer writes them: this repository is distributed over git and
      # publishes to no registry, so the entries named versions that did not
      # exist, which is what broke `pnpm install --frozen-lockfile` in the first
      # step of this job and of every release.
      #
      # A git diff here would now pass without checking anything, and a check
      # that cannot fail is worse than no check: it reads as coverage. The
      # property it was defending moved into the conformance suite, where
      # release-shape.mjs asserts the lockfile and every manifest agree, and
      # fails on exactly the state this repository was in.
      - name: the build left the tree alone
        run: |
          if ! git diff --exit-code -- packages/proxy/package.json pnpm-lock.yaml; then
            echo
            echo "build:go modified a manifest or the lockfile, which it must not do."
            exit 1
          fi

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history. A secret that was committed and then removed is
          # still a secret, and scanning only the tip would miss every one of
          # them.
          fetch-depth: 0

      # THE BINARY, NOT gitleaks/gitleaks-action@v2.
      #
      # The action refuses to run for an organisation without a paid licence:
      # "[solongate] is an organization. License key is required." It cost
      # nothing while this repository belonged to a person and started failing
      # the moment it moved, with no change to the code it scans.
      #
      # gitleaks itself is MIT and free. Only the wrapper is licensed, so the
      # wrapper is what goes.
      #
      # PINNED AND VERIFIED. A step that downloads a binary and runs it over the
      # whole repository is a supply chain, and a security scan that could be
      # swapped underneath us is worth less than no scan: it would still report
      # green. The version is fixed and the checksum is checked before the file
      # is allowed to execute.
      - name: gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" gitleaks

          # `git` rather than `detect`: 8.19 deprecated detect and hid it from
          # --help. It still runs today and will not forever.
          #
          # --redact so a finding names the rule and the file without printing
          # the secret into a public build log, which is the one place a leak
          # gets worse by being reported.
          ./gitleaks git --config .gitleaks.toml --redact --exit-code 1 .
