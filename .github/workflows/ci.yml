name: ci

# WHAT THESE JOBS DO NOT DO: decide whether the guard is correct.
#
# The conformance suite was the contract. It ran twice, once against the Node
# hook and once against the Go binary, and it was the only thing in the
# repository that compared the two implementations to each other. It has been
# removed, along with every Go test, and nothing took its place.
#
# So read the green tick for what it now means: the Go code is formatted, it
# vets, it compiles, the hooks bundle, the release script runs, and no secret is
# committed. Whether a tool call that should be refused gets refused is not
# among the things anything here asks.
#
# There is no TypeScript job either, because there is no TypeScript left to
# check. The CLI and the TUI were removed once the Go port replaced them and
# distribution stopped going through npm. What remains in packages/hooks is
# .mjs hook programs, which run under node and are typechecked by nothing.
#
# Three jobs used to live here and do not any more: the schema applied to a real
# PostgreSQL and a real SQLite, and a real Keycloak signed a device in end to end.
# Each of them caught something real. They went with the server they tested.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    name: go (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - packages/guard
          - packages/policy
          - packages/shared
          - packages/core
          - packages/cli
          - packages/tui
          - packages/app
    steps:
      - uses: actions/checkout@v7

      # THE VERSION THE MODULE DECLARES, not a number typed into three files.
      #
      # OPA 1.21.1 requires go 1.26, so taking it raised the `go` line in
      # guard and policy while this pin stayed at 1.25. setup-go sets
      # GOTOOLCHAIN=local, so `go vet` refused to run rather than fetching what
      # it needed, and every laptop with a newer toolchain built the same tree
      # without a word. Reading go.mod is how the pin stops being able to drift
      # from the thing it pins.
      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.sum

      # gofmt before the tests: a formatting failure is cheap to find and
      # reading a diff is not what a reviewer should spend attention on.
      - name: gofmt
        working-directory: ${{ matrix.module }}
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt'd:"; echo "$unformatted"
            gofmt -d $unformatted
            exit 1
          fi

      - name: vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...

      # There is no test step. The 56 _test.go files these four modules had are
      # gone, so `go test ./...` would report "no test files" for every package
      # and pass without looking at anything. A check that cannot fail reads as
      # coverage, which is worse than the absence it would be papering over.

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # No `version` input: package.json's `packageManager` field is the one
      # source, and action-setup v4 REFUSES when both are set rather than
      # picking one. That refusal is what failed the two pnpm jobs on the first
      # run, five seconds in, before pnpm existed to report anything.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts

      # This bundles hooks/guard.mjs into hooks/guard.bundled.mjs, which is
      # the file that installs as the guard: readGuard prefers it, with opa-wasm
      # inlined. The unbundled hook imports two siblings and an npm package, and
      # whether those resolve on a stranger's machine is not a thing to find out
      # on the decision path.
      - name: build
        working-directory: packages/hooks
        run: pnpm build

      # THE RELEASE BUILD, which nothing here exercised until it was broken.
      #
      # This is the script that produces what users install, and it spent an
      # unknown number of weeks unable to build this repository at all: it built
      # a third program from a module that is not in the tree, and spawnSync
      # reports a missing `cwd` as ENOENT on the COMMAND, so the failure read as
      # "no Go toolchain" on machines that had one. Every job above was green
      # throughout.
      #
      # One target, not six. Six takes minutes and proves nothing more about the
      # script.
      #
      # go.mod rather than a pinned number, for the reason given above the
      # matrix.
      - uses: actions/setup-go@v7
        with:
          go-version-file: packages/guard/go.mod
          cache-dependency-path: packages/guard/go.sum
      - name: the release build works
        working-directory: packages/hooks
        run: pnpm build:go linux-x64

      # AND THAT IT CHANGED NOTHING IT SHOULD NOT HAVE.
      #
      # build:go used to rewrite six optionalDependencies into
      # packages/hooks/package.json, each pinned to a version that was never
      # published. pnpm cannot record an optional dependency it cannot resolve,
      # so the lockfile never held them, and `pnpm install --frozen-lockfile`
      # could not pass on any machine. It failed every CI run and every release
      # job, which is why five pushed tags produced no releases at all.
      #
      # Know what this is worth: it fires only if the script starts writing to
      # the tree again. The check that asserted the lockfile and every manifest
      # agree, which is the property that was actually broken, lived in the
      # conformance suite and went with it.
      - name: the build left the tree alone
        run: |
          if ! git diff --exit-code -- packages/hooks/package.json pnpm-lock.yaml; then
            echo
            echo "build:go modified a manifest or the lockfile, which it must not do."
            exit 1
          fi

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history. A secret that was committed and then removed is
          # still a secret, and scanning only the tip would miss every one of
          # them.
          fetch-depth: 0

      # THE BINARY, NOT gitleaks/gitleaks-action@v2.
      #
      # The action refuses to run for an organisation without a paid licence:
      # "[solongate] is an organization. License key is required." It cost
      # nothing while this repository belonged to a person and started failing
      # the moment it moved, with no change to the code it scans.
      #
      # gitleaks itself is MIT and free. Only the wrapper is licensed, so the
      # wrapper is what goes.
      #
      # PINNED AND VERIFIED. A step that downloads a binary and runs it over the
      # whole repository is a supply chain, and a security scan that could be
      # swapped underneath us is worth less than no scan: it would still report
      # green. The version is fixed and the checksum is checked before the file
      # is allowed to execute.
      - name: gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" gitleaks

          # `git` rather than `detect`: 8.19 deprecated detect and hid it from
          # --help. It still runs today and will not forever.
          #
          # --redact so a finding names the rule and the file without printing
          # the secret into a public build log, which is the one place a leak
          # gets worse by being reported.
          ./gitleaks git --config .gitleaks.toml --redact --exit-code 1 .
