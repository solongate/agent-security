# yaml for releases in github
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 
      - name: the tag matches the version it claims
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(cat packages/hooks/VERSION)"
          if [ "$tag" != "$pkg" ]; then
            echo "tag v$tag, but packages/hooks/VERSION says $pkg" >&2
            echo "bump the file and the tag together, or the binaries lie about which one they are" >&2
            exit 1
          fi
          echo "v$tag"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: packages/guard/go.mod
          cache-dependency-path: packages/guard/go.sum

      - name: build every platform
        run: ./packages/hooks/scripts/build-platforms.sh

      - name: one archive per platform
        run: |
          cd packages/hooks/platforms
          for d in */; do
            t="${d%/}"
            tar -czf "$GITHUB_WORKSPACE/solongate-${GITHUB_REF_NAME}-${t}.tar.gz" -C "$t" .
          done
          ls -la "$GITHUB_WORKSPACE"/*.tar.gz

      - name: checksums
        run: |
          cd "$GITHUB_WORKSPACE"
          sha256sum *.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: sign the release tag
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          commit="$(git -C "$GITHUB_WORKSPACE" rev-parse "$GITHUB_REF_NAME^{commit}")"
          (cd "$GITHUB_WORKSPACE/packages/crypto" && go run ./cmd/sign-release "$GITHUB_REF_NAME" "$commit") > "$GITHUB_WORKSPACE/TAG_SIG"
          cat "$GITHUB_WORKSPACE/TAG_SIG"

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ github.workspace }}/*.tar.gz

      - name: download the attestation bundles
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$GITHUB_WORKSPACE"
          for f in *.tar.gz; do
            d="$(mktemp -d)"
            cp "$f" "$d/"
            (cd "$d" && gh attestation download "$f" -R "$GITHUB_REPOSITORY")
            mv "$d"/*.jsonl "$f.intoto.jsonl"
            rm -rf "$d"
          done

      - name: the changelog entry for this version
        run: |
          version="${GITHUB_REF_NAME#v}"
          body="$(awk -v ver="## v$version" '
            $0 == ver { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md)"
          if [ -z "$(echo "$body" | tr -d '[:space:]')" ]; then
            echo "No CHANGELOG.md section for ## v$version -- add one before tagging" >&2
            exit 1
          fi
          echo "$body" > changelog-entry.md

      - name: the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prev="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          {
            echo "Installed over git. This repository does not publish to a registry."
            echo
            echo '```'
            echo "git clone https://github.com/$GITHUB_REPOSITORY"
            # The directory clone makes, derived from the same variable as the
            # clone itself. It was the literal "solongate" and stayed that way
            # through a rename, so the two lines of a three line install told
            # the reader to enter a directory the line above had not made.
            echo "cd ${GITHUB_REPOSITORY#*/} && ./scripts/install.sh"
            echo '```'
            echo
            echo "Already installed: \`solongate update\`"
            echo
            echo "Checking what you downloaded:"
            echo
            echo '```'
            echo "sha256sum -c SHA256SUMS --ignore-missing"
            echo "gh attestation verify <archive> -R $GITHUB_REPOSITORY"
            echo "# or offline, from the attached bundle:"
            echo "gh attestation verify <archive> --bundle <archive>.intoto.jsonl"
            echo '```'
            echo
            echo "## Changes"
            echo
            cat changelog-entry.md
            if [ -n "$prev" ]; then
              echo
              echo "Full diff: https://github.com/$GITHUB_REPOSITORY/compare/$prev...$GITHUB_REF_NAME"
            fi
          } > notes.md
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md \
            "$GITHUB_WORKSPACE"/*.tar.gz \
            "$GITHUB_WORKSPACE"/*.intoto.jsonl \
            "$GITHUB_WORKSPACE/SHA256SUMS" \
            "$GITHUB_WORKSPACE/TAG_SIG"