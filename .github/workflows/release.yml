name: release

# A TAG IS THE ONLY THING THAT MAKES A VERSION VISIBLE.
#
# The version lives in packages/proxy/package.json and is stamped into the
# binaries with -ldflags, so `solongate doctor` can print it. That was the whole
# of it: nothing on GitHub showed the number, there were no tags and no releases,
# and the only way to learn what 0.91.31 meant was to read the commit that typed
# it. Twice in one day the manifest and the commit message disagreed, because
# nothing compared them.
#
# This repository is distributed over git, not a registry: `solongate update`
# pulls the recorded checkout and runs install.sh, which builds from source. The
# archives attached here are a record of what a tag produced, never the install
# path.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the notes are built from the log

      # THE TAG AND THE MANIFEST HAVE TO AGREE. A release whose binaries report a
      # different version than the tag that produced them is worse than no
      # release: doctor and the download page would each be telling the truth
      # about a different build.
      - name: the tag matches the version it claims
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./packages/proxy/package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "tag v$tag, but packages/proxy/package.json says $pkg" >&2
            echo "bump the manifest and the tag together, or the binaries lie about which one they are" >&2
            exit 1
          fi
          echo "v$tag"

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: packages/guard-go/go.sum

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # All six targets cross-compile from here: CGO is off, so there is no
      # per-platform toolchain to install.
      - name: build every platform
        working-directory: packages/proxy
        run: pnpm build:go

      - name: one archive per platform
        run: |
          cd packages/proxy/platforms
          for d in */; do
            t="${d%/}"
            tar -czf "$GITHUB_WORKSPACE/solongate-${GITHUB_REF_NAME}-${t}.tar.gz" -C "$t" .
          done
          ls -la "$GITHUB_WORKSPACE"/*.tar.gz

      - name: the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prev="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          if [ -n "$prev" ]; then range="$prev..$GITHUB_REF_NAME"; else range="$GITHUB_REF_NAME"; fi
          {
            echo "Installed over git. This repository does not publish to a registry."
            echo
            echo '```'
            echo "git clone https://github.com/$GITHUB_REPOSITORY"
            echo "cd solongate && ./install.sh"
            echo '```'
            echo
            echo "Already installed: \`solongate update\`"
            echo
            echo "## Changes"
            echo
            git log --no-merges --format='- %s' "$range"
          } > notes.md
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md \
            "$GITHUB_WORKSPACE"/*.tar.gz
