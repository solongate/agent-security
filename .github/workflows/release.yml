name: release

# A TAG IS THE ONLY THING THAT MAKES A VERSION VISIBLE.
#
# The version lives in packages/hooks/package.json and is stamped into the
# binaries with -ldflags, so `solongate doctor` can print it. That was the whole
# of it: nothing on GitHub showed the number, there were no tags and no releases,
# and the only way to learn what 0.91.31 meant was to read the commit that typed
# it. Twice in one day the manifest and the commit message disagreed, because
# nothing compared them.
#
# This repository is distributed over git, not a registry: `solongate update`
# pulls the recorded checkout and runs install.sh, which builds from source. The
# archives attached here are a record of what a tag produced, never the install
# path.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  # The attestation is signed through Sigstore with a short-lived OIDC identity
  # minted for this run, so there is no key here to manage or to leak. Both
  # scopes are what that needs and nothing more: id-token to prove which
  # workflow is asking, attestations to record the answer.
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # the notes are built from the log

      # THE TAG AND THE MANIFEST HAVE TO AGREE. A release whose binaries report a
      # different version than the tag that produced them is worse than no
      # release: doctor and the download page would each be telling the truth
      # about a different build.
      - name: the tag matches the version it claims
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./packages/hooks/package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "tag v$tag, but packages/hooks/package.json says $pkg" >&2
            echo "bump the manifest and the tag together, or the binaries lie about which one they are" >&2
            exit 1
          fi
          echo "v$tag"

      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: pnpm
      # go.mod rather than a number, for the reason given in ci.yml. A release
      # built by a toolchain older than the modules declare does not build at
      # all, and this is the job where that produces no binaries and no release.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: packages/guard/go.mod
          cache-dependency-path: packages/guard/go.sum

      # --ignore-scripts, like CI. This is the job whose output people run, so
      # it is the LAST place a dependency's postinstall should get to execute.
      # CI had the flag and this did not, which is backwards: a lifecycle script
      # here reaches the binaries, and in CI it reaches a throwaway runner.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm build

      # All six targets cross-compile from here: CGO is off, so there is no
      # per-platform toolchain to install.
      - name: build every platform
        working-directory: packages/hooks
        run: pnpm build:go

      - name: one archive per platform
        run: |
          cd packages/hooks/platforms
          for d in */; do
            t="${d%/}"
            tar -czf "$GITHUB_WORKSPACE/solongate-${GITHUB_REF_NAME}-${t}.tar.gz" -C "$t" .
          done
          ls -la "$GITHUB_WORKSPACE"/*.tar.gz

      # A CHECKSUM FILE, so somebody who downloaded an archive can tell whether
      # it is the one this job built. There was nothing: the release had six
      # tarballs and no way to check any of them.
      - name: checksums
        run: |
          cd "$GITHUB_WORKSPACE"
          sha256sum *.tar.gz > SHA256SUMS
          cat SHA256SUMS

      # AND A SIGNED STATEMENT OF WHERE THEY CAME FROM. The checksum says the
      # bytes did not change; the attestation says which workflow, at which
      # commit, produced them, which is the half a checksum published beside
      # the artifact cannot establish on its own, because whoever replaced the
      # artifact could replace the checksum too.
      #
      # Sigstore-backed and verifiable with `gh attestation verify`, so it needs
      # no key of ours to manage and no key of a user's to trust.
      - uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: ${{ github.workspace }}/*.tar.gz

      - name: the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prev="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          if [ -n "$prev" ]; then range="$prev..$GITHUB_REF_NAME"; else range="$GITHUB_REF_NAME"; fi
          {
            echo "Installed over git. This repository does not publish to a registry."
            echo
            echo '```'
            echo "git clone https://github.com/$GITHUB_REPOSITORY"
            # The directory clone makes, derived from the same variable as the
            # clone itself. It was the literal "solongate" and stayed that way
            # through a rename, so the two lines of a three line install told
            # the reader to enter a directory the line above had not made.
            echo "cd ${GITHUB_REPOSITORY#*/} && ./scripts/shell/install.sh"
            echo '```'
            echo
            echo "Already installed: \`solongate update\`"
            echo
            echo "Checking what you downloaded:"
            echo
            echo '```'
            echo "sha256sum -c SHA256SUMS --ignore-missing"
            echo "gh attestation verify <archive> -R $GITHUB_REPOSITORY"
            echo '```'
            echo
            echo "## Changes"
            echo
            git log --no-merges --format='- %s' "$range"
          } > notes.md
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md \
            "$GITHUB_WORKSPACE"/*.tar.gz \
            "$GITHUB_WORKSPACE/SHA256SUMS"