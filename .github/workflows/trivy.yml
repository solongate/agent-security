name: trivy

# Trivy: filesystem scan for known vulnerabilities in dependencies (go.sum,
# pnpm-lock.yaml) and misconfigurations. Secret detection is off here;
# gitleaks in ci.yml already owns that, scanning the full history rather
# than the checked-out tree.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "43 5 * * 3"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: trivy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,misconfig
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: 0

      - uses: github/codeql-action/upload-sarif@9f759ee644a3e7c15c1390abf49868036c00067b # v3.38.3
        with:
          sarif_file: trivy-results.sarif