# THE OLD ALLOWLIST SAID `sg_test_[a-f0-9]+`, and that is the bug this file
# exists to not repeat.
#
# It reads as "test keys are fine" and means "anything beginning sg_test_ is
# fine". A test key is a real credential against a real project. Four of them
# reached the history of the repository this one was carved out of, and that
# pattern is exactly why nothing objected.
#
# So detection is by SHAPE and not by prefix, and the noise is suppressed by
# turning off the rule that produces it rather than by allowlisting the files it
# fires in. Allowlisting `_test.go` would have hidden those four keys too.

[extend]
useDefault = true

# generic-api-key is a heuristic: it flags `something_key = "…"` wherever it
# finds it. In a repository whose product DETECTS secrets, the test data is
# deliberately secret-shaped — input-guard.json is a corpus of things a leak
# scanner should catch — so the rule fires nineteen times and is right zero
# times. Every one was a fixture, a golden hash, or a comment.
#
# It is off rather than allowlisted per path, because the entropy rule below
# catches this product's own credential shape anywhere it appears, including in
# a test, and the default rules still cover AWS keys, GitHub tokens, private
# keys, Supabase JWTs and the rest.
disabledRules = ["generic-api-key"]

# A SolonGate credential, by the only property that cannot be faked: length and
# hex. A real key is `sg_live_`/`sg_test_` plus 48 or more hex digits.
#
# Every fixture in this repository fails that — they are short (`sg_live_aaaa`),
# padded (`sg_live_example00000000`), or carry a word (`sg_test_local_only`) —
# and all seven keys found in the old private history match it. There is no
# allowlist on this rule on purpose: a credential must not become acceptable by
# sitting in a file somebody called a test.
[[rules]]
id = "solongate-api-key"
description = "SolonGate API credential (sg_live_/sg_test_ + 48 hex)"
regex = '''sg_(live|test)_[a-fA-F0-9]{32,}'''
keywords = ["sg_live_", "sg_test_"]

[allowlist]
description = "Build output and the env template"
paths = [
  '''\.env\.example''',
  '''node_modules/''',
  '''dist/''',
  '''platforms/''',
  '''dist-platforms/''',
]
