version = 1
SPDX-PackageName = "agent-security"
SPDX-PackageDownloadLocation = "https://github.com/solongate/agent-security"

[[annotations]]
path = [
  "**/*.md",
  "**/*.yml",
  "**/*.yaml",
  "**/*.json",
  ".all-contributorsrc",
  "**/*.toml",
  "**/*.mod",
  "**/*.sum",
  "**/*.mts",
  "**/*.properties",
  "**/*.png",
  "**/*.gif",
  "**/*.svg",
  "**/.gitignore",
  "**/.npmignore",
  ".github/CODEOWNERS",
  ".trivyignore",
  "packages/hooks/VERSION",
]
SPDX-FileCopyrightText = "2026 the SolonGate contributors"
SPDX-License-Identifier = "Apache-2.0"