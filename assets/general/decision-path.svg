<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 616" width="1200" height="616" role="img" aria-label="The five layers a tool call passes through, and the denial branch">
  <title>The decision path</title>
  <defs>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 0 10 5 0 10z" fill="#383838"/>
  </marker>
  <marker id="ard" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 0 10 5 0 10z" fill="#dc5050"/>
  </marker>
  </defs>
  <rect width="1200" height="616" fill="#1a1a1a"/>

  <rect x="742.5" y="112.5" width="397" height="377" fill="#1a1a1a" stroke="#dc5050"/>
  <text x="941" y="272" text-anchor="middle" font-family="Geist,Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="20" font-weight="600" letter-spacing="1" fill="#dc5050">DENIED</text>
  <text x="941" y="306" text-anchor="middle" font-family="Geist,Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#f2f2f2">Any layer can refuse, and the tool never runs.</text>
  <text x="941" y="330" text-anchor="middle" font-family="Geist,Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#8c8c8c">The refusal is written to the audit trail</text>
  <text x="941" y="350" text-anchor="middle" font-family="Geist,Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#8c8c8c">before the agent is answered.</text>

  <rect x="250.5" y="32.5" width="419" height="57" fill="#1a1a1a" stroke="#383838"/>
  <text x="274" y="60" font-family="Geist,Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#f2f2f2">An agent asks to run a tool</text>
  <text x="274" y="78" font-family="Geist,Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#8c8c8c">a shell command, a file read, a write</text>

  <line x1="460" y1="90" x2="460" y2="110" stroke="#383838" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="460" y1="170" x2="460" y2="190" stroke="#383838" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="460" y1="250" x2="460" y2="270" stroke="#383838" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="460" y1="330" x2="460" y2="350" stroke="#383838" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="460" y1="410" x2="460" y2="430" stroke="#383838" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="460" y1="490" x2="460" y2="510" stroke="#383838" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="250.5" y="112.5" width="419" height="57" fill="#1a1a1a" stroke="#383838"/>
  <rect x="265.5" y="128.5" width="25" height="25" fill="#1a1a1a" stroke="#3ba9ee"/>
  <text x="278" y="146" text-anchor="middle" font-family="Geist,Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#3ba9ee">1</text>
  <text x="306" y="137" font-family="Geist,Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#f2f2f2">Tamper protection</text>
  <text x="306" y="156" font-family="Geist,Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#8c8c8c">The guard state a tool call must never reach</text>
  <line x1="670" y1="141" x2="740" y2="141" stroke="#dc5050" stroke-width="1.5" stroke-opacity="0.65" marker-end="url(#ard)"/>
  <rect x="250.5" y="192.5" width="419" height="57" fill="#1a1a1a" stroke="#383838"/>
  <rect x="265.5" y="208.5" width="25" height="25" fill="#1a1a1a" stroke="#3ba9ee"/>
  <text x="278" y="226" text-anchor="middle" font-family="Geist,Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#3ba9ee">2</text>
  <text x="306" y="217" font-family="Geist,Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#f2f2f2">Rate limit</text>
  <text x="306" y="236" font-family="Geist,Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#8c8c8c">Reserve a slot, then count the window</text>
  <line x1="670" y1="221" x2="740" y2="221" stroke="#dc5050" stroke-width="1.5" stroke-opacity="0.65" marker-end="url(#ard)"/>
  <rect x="250.5" y="272.5" width="419" height="57" fill="#1a1a1a" stroke="#383838"/>
  <rect x="265.5" y="288.5" width="25" height="25" fill="#1a1a1a" stroke="#3ba9ee"/>
  <text x="278" y="306" text-anchor="middle" font-family="Geist,Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#3ba9ee">3</text>
  <text x="306" y="297" font-family="Geist,Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#f2f2f2">Policy rules</text>
  <text x="306" y="316" font-family="Geist,Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#8c8c8c">Your JSON, compiled to Rego and evaluated in process</text>
  <line x1="670" y1="301" x2="740" y2="301" stroke="#dc5050" stroke-width="1.5" stroke-opacity="0.65" marker-end="url(#ard)"/>
  <rect x="250.5" y="352.5" width="419" height="57" fill="#1a1a1a" stroke="#383838"/>
  <rect x="265.5" y="368.5" width="25" height="25" fill="#1a1a1a" stroke="#3ba9ee"/>
  <text x="278" y="386" text-anchor="middle" font-family="Geist,Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#3ba9ee">4</text>
  <text x="306" y="377" font-family="Geist,Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#f2f2f2">DLP</text>
  <text x="306" y="396" font-family="Geist,Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#8c8c8c">Three views, so a split or encoded secret still matches</text>
  <line x1="670" y1="381" x2="740" y2="381" stroke="#dc5050" stroke-width="1.5" stroke-opacity="0.65" marker-end="url(#ard)"/>
  <rect x="250.5" y="432.5" width="419" height="57" fill="#1a1a1a" stroke="#383838"/>
  <rect x="265.5" y="448.5" width="25" height="25" fill="#1a1a1a" stroke="#3ba9ee"/>
  <text x="278" y="466" text-anchor="middle" font-family="Geist,Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#3ba9ee">5</text>
  <text x="306" y="457" font-family="Geist,Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#f2f2f2">Egress</text>
  <text x="306" y="476" font-family="Geist,Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#8c8c8c">Read the files an upload command would actually send</text>
  <line x1="670" y1="461" x2="740" y2="461" stroke="#dc5050" stroke-width="1.5" stroke-opacity="0.65" marker-end="url(#ard)"/>

  <rect x="250.5" y="512.5" width="419" height="57" fill="#1a1a1a" stroke="#50c878"/>
  <text x="274" y="540" font-family="Geist,Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#50c878">ALLOWED, the tool runs</text>
  <text x="274" y="558" font-family="Geist,Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#8c8c8c">and the call is recorded</text>

  <text x="250" y="600" font-family="Geist,Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#8c8c8c">Every step is on this machine. Nothing is asked over a network on the decision path.</text>
</svg>
