<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 424" width="1200" height="424" role="img" aria-label="Two implementations of the guard reaching one verdict">
  <title>Two implementations, one verdict</title>
  <defs>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 0 10 5 0 10z" fill="#383838"/>
  </marker>
  <marker id="ard" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 0 10 5 0 10z" fill="#dc5050"/>
  </marker>
  </defs>
  <rect width="1200" height="424" fill="#1a1a1a"/>

  <rect x="490.5" y="28.5" width="219" height="49" fill="#1a1a1a" stroke="#383838"/>
  <text x="600" y="59" text-anchor="middle" font-family="Geist,Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#f2f2f2">A tool call</text>
  <line x1="600" y1="78" x2="600" y2="102" stroke="#383838" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="390.5" y="104.5" width="419" height="55" fill="#1a1a1a" stroke="#3ba9ee"/>
  <text x="600" y="139" text-anchor="middle" font-family="Geist,Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#3ba9ee">Does this machine have the Go binary?</text>

  <path d="M600 160 600 188 320 188 320 214" fill="none" stroke="#383838" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M600 160 600 188 880 188 880 214" fill="none" stroke="#383838" stroke-width="2" marker-end="url(#ar)"/>
  <text x="332" y="182" font-family="Geist,Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#8c8c8c">yes</text>
  <text x="868" y="182" text-anchor="end" font-family="Geist,Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#8c8c8c">no</text>

  <rect x="130.5" y="216.5" width="379" height="71" fill="#1a1a1a" stroke="#383838"/>
  <text x="320" y="248" text-anchor="middle" font-family="'Geist Mono',ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" fill="#f2f2f2">packages/guard</text>
  <text x="320" y="270" text-anchor="middle" font-family="Geist,Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#8c8c8c">the Go binary decides</text>

  <rect x="690.5" y="216.5" width="379" height="71" fill="#1a1a1a" stroke="#383838"/>
  <text x="880" y="248" text-anchor="middle" font-family="'Geist Mono',ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" fill="#f2f2f2">guard.bundled.mjs</text>
  <text x="880" y="270" text-anchor="middle" font-family="Geist,Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#8c8c8c">the bundled Node hook decides</text>

  <path d="M320 288 320 314 600 314 600 328" fill="none" stroke="#383838" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M880 288 880 314 600 314" fill="none" stroke="#383838" stroke-width="2"/>

  <rect x="330.5" y="330.5" width="539" height="55" fill="#1a1a1a" stroke="#50c878"/>
  <text x="600" y="365" text-anchor="middle" font-family="Geist,Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#50c878">The same verdict, for the same reason</text>

  <text x="600" y="410" text-anchor="middle" font-family="Geist,Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#8c8c8c">One conformance suite judges both, so a divergence between them is a bug by definition.</text>
</svg>
