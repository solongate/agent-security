<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="SolonGate: a policy gate for AI coding agents">
  <title>SolonGate</title>
  <rect x="0.5" y="0.5" width="1199" height="299" fill="#1a1a1a" stroke="#383838"/>

  <g transform="translate(31.4 66.6) scale(1.4)">
    <defs>
      <mask id="slot">
        <rect width="96" height="96" fill="#fff"/>
        <rect x="45" y="24" width="6" height="45" rx="3" fill="#000"/>
      </mask>
    </defs>
    <g fill="#f2f2f2" mask="url(#slot)">
      <rect x="39" y="21" width="18" height="50" rx="3"/>
      <rect x="29" y="37" width="38" height="18" rx="3"/>
    </g>
  </g>

  <text x="160" y="134" font-family="Geist,Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="54" font-weight="600" letter-spacing="-0.8" fill="#f2f2f2">SolonGate</text>
  <text x="162" y="169" font-family="Geist,Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="20" fill="#8c8c8c">Guardrail of AI Agents</text>

  <g font-family="Geist,Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#8c8c8c">
    <rect x="162.5" y="194.5" width="181" height="27" fill="#1a1a1a" stroke="#383838"/>
    <text x="253" y="213" text-anchor="middle">Runs on your machine</text>
    <rect x="352.5" y="194.5" width="111" height="27" fill="#1a1a1a" stroke="#383838"/>
    <text x="408" y="213" text-anchor="middle">No account</text>
    <rect x="472.5" y="194.5" width="123" height="27" fill="#1a1a1a" stroke="#383838"/>
    <text x="534" y="213" text-anchor="middle">No telemetry</text>
    <rect x="604.5" y="194.5" width="57" height="27" fill="#1a1a1a" stroke="#383838"/>
    <text x="633" y="213" text-anchor="middle">MIT</text>
  </g>

  <rect x="756.5" y="94.5" width="381" height="51" fill="#1a1a1a" stroke="#383838"/>
  <rect x="756" y="94" width="3" height="52" fill="#50c878"/>
  <text x="778" y="126" font-family="'Geist Mono',ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" fill="#f2f2f2">git status</text>
  <text x="1118" y="126" text-anchor="end" font-family="Geist,Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#50c878">allowed</text>

  <rect x="756.5" y="158.5" width="381" height="51" fill="#1a1a1a" stroke="#383838"/>
  <rect x="756" y="158" width="3" height="52" fill="#dc5050"/>
  <text x="778" y="190" font-family="'Geist Mono',ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" fill="#f2f2f2">git push --force</text>
  <text x="1118" y="190" text-anchor="end" font-family="Geist,Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#dc5050">denied</text>
</svg>
