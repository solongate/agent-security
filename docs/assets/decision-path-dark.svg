<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 616" width="1200" height="616" role="img" aria-label="The five layers a tool call passes through, and the denial branch">
  <title>The decision path</title>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#30363d"/>
    </marker>
    <marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#f85149"/>
    </marker>
  </defs>
  <rect width="1200" height="616" fill="none"/>

  <rect x="742.5" y="112.5" width="398" height="378" rx="12" fill="#2a1416" stroke="#f85149" stroke-opacity="0.5"/>
  <text x="941" y="272" text-anchor="middle" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="20" font-weight="700" fill="#f85149">DENIED</text>
  <text x="941" y="304" text-anchor="middle" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#e6edf3">Any layer can refuse, and the tool never runs.</text>
  <text x="941" y="328" text-anchor="middle" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#8b949e">The refusal is written to the audit trail</text>
  <text x="941" y="348" text-anchor="middle" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#8b949e">before the agent is answered.</text>

  <rect x="250.5" y="32.5" width="420" height="58" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="274" y="60" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#e6edf3">An agent asks to run a tool</text>
  <text x="274" y="78" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#8b949e">a shell command, a file read, a write</text>

  <line x1="460" y1="90" x2="460" y2="110" stroke="#30363d" stroke-width="2" marker-end="url(#a)"/>
  <line x1="460" y1="170" x2="460" y2="190" stroke="#30363d" stroke-width="2" marker-end="url(#a)"/>
  <line x1="460" y1="250" x2="460" y2="270" stroke="#30363d" stroke-width="2" marker-end="url(#a)"/>
  <line x1="460" y1="330" x2="460" y2="350" stroke="#30363d" stroke-width="2" marker-end="url(#a)"/>
  <line x1="460" y1="410" x2="460" y2="430" stroke="#30363d" stroke-width="2" marker-end="url(#a)"/>
  <line x1="460" y1="490" x2="460" y2="510" stroke="#30363d" stroke-width="2" marker-end="url(#a)"/>

  <rect x="250.5" y="112.5" width="420" height="58" rx="10" fill="#0d1117" stroke="#30363d"/>
  <circle cx="278" cy="141" r="13" fill="#121d2f" stroke="#4493f8" stroke-opacity="0.4"/>
  <text x="278" y="146" text-anchor="middle" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#4493f8">1</text>
  <text x="306" y="137" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#e6edf3">Tamper protection</text>
  <text x="306" y="156" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#8b949e">The guard state a tool call must never reach</text>
  <line x1="670" y1="141" x2="740" y2="141" stroke="#f85149" stroke-width="1.75" stroke-opacity="0.55" marker-end="url(#ad)"/>
  <rect x="250.5" y="192.5" width="420" height="58" rx="10" fill="#0d1117" stroke="#30363d"/>
  <circle cx="278" cy="221" r="13" fill="#121d2f" stroke="#4493f8" stroke-opacity="0.4"/>
  <text x="278" y="226" text-anchor="middle" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#4493f8">2</text>
  <text x="306" y="217" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#e6edf3">Rate limit</text>
  <text x="306" y="236" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#8b949e">Reserve a slot, then count the window</text>
  <line x1="670" y1="221" x2="740" y2="221" stroke="#f85149" stroke-width="1.75" stroke-opacity="0.55" marker-end="url(#ad)"/>
  <rect x="250.5" y="272.5" width="420" height="58" rx="10" fill="#0d1117" stroke="#30363d"/>
  <circle cx="278" cy="301" r="13" fill="#121d2f" stroke="#4493f8" stroke-opacity="0.4"/>
  <text x="278" y="306" text-anchor="middle" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#4493f8">3</text>
  <text x="306" y="297" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#e6edf3">Policy rules</text>
  <text x="306" y="316" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#8b949e">Your JSON, compiled to Rego and evaluated in process</text>
  <line x1="670" y1="301" x2="740" y2="301" stroke="#f85149" stroke-width="1.75" stroke-opacity="0.55" marker-end="url(#ad)"/>
  <rect x="250.5" y="352.5" width="420" height="58" rx="10" fill="#0d1117" stroke="#30363d"/>
  <circle cx="278" cy="381" r="13" fill="#121d2f" stroke="#4493f8" stroke-opacity="0.4"/>
  <text x="278" y="386" text-anchor="middle" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#4493f8">4</text>
  <text x="306" y="377" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#e6edf3">DLP</text>
  <text x="306" y="396" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#8b949e">Three views of the call, so a split or encoded secret still matches</text>
  <line x1="670" y1="381" x2="740" y2="381" stroke="#f85149" stroke-width="1.75" stroke-opacity="0.55" marker-end="url(#ad)"/>
  <rect x="250.5" y="432.5" width="420" height="58" rx="10" fill="#0d1117" stroke="#30363d"/>
  <circle cx="278" cy="461" r="13" fill="#121d2f" stroke="#4493f8" stroke-opacity="0.4"/>
  <text x="278" y="466" text-anchor="middle" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#4493f8">5</text>
  <text x="306" y="457" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#e6edf3">Egress</text>
  <text x="306" y="476" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#8b949e">Read the files an upload command would actually send</text>
  <line x1="670" y1="461" x2="740" y2="461" stroke="#f85149" stroke-width="1.75" stroke-opacity="0.55" marker-end="url(#ad)"/>

  <rect x="250.5" y="512.5" width="420" height="58" rx="10" fill="#0f2417" stroke="#3fb950" stroke-opacity="0.5"/>
  <text x="274" y="540" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#3fb950">ALLOWED, the tool runs</text>
  <text x="274" y="558" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#8b949e">and the call is recorded</text>

  <text x="250" y="600" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#8b949e">Every step is on this machine. Nothing is asked over a network on the decision path.</text>
</svg>
