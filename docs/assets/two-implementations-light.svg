<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 424" width="1200" height="424" role="img" aria-label="Two implementations of the guard reaching one verdict">
  <title>Two implementations, one verdict</title>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#d0d7de"/>
    </marker>
    <marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#cf222e"/>
    </marker>
  </defs>

  <rect x="490.5" y="28.5" width="220" height="50" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="600" y="59" text-anchor="middle" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#1f2328">A tool call</text>
  <line x1="600" y1="78" x2="600" y2="102" stroke="#d0d7de" stroke-width="2" marker-end="url(#a)"/>

  <rect x="390.5" y="104.5" width="420" height="56" rx="10" fill="#ddf4ff" stroke="#0969da" stroke-opacity="0.5"/>
  <text x="600" y="139" text-anchor="middle" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#0969da">Does this machine have the Go binary?</text>

  <path d="M600 160 600 188 320 188 320 214" fill="none" stroke="#d0d7de" stroke-width="2" marker-end="url(#a)"/>
  <path d="M600 160 600 188 880 188 880 214" fill="none" stroke="#d0d7de" stroke-width="2" marker-end="url(#a)"/>
  <text x="332" y="182" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#656d76">yes</text>
  <text x="868" y="182" text-anchor="end" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#656d76">no</text>

  <rect x="130.5" y="216.5" width="380" height="72" rx="10" fill="#ffffff" stroke="#d0d7de"/>
  <text x="320" y="248" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" fill="#1f2328">packages/guard-go</text>
  <text x="320" y="270" text-anchor="middle" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#656d76">the Go binary decides</text>

  <rect x="690.5" y="216.5" width="380" height="72" rx="10" fill="#ffffff" stroke="#d0d7de"/>
  <text x="880" y="248" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" fill="#1f2328">guard.bundled.mjs</text>
  <text x="880" y="270" text-anchor="middle" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#656d76">the bundled Node hook decides</text>

  <path d="M320 288 320 314 600 314 600 328" fill="none" stroke="#d0d7de" stroke-width="2" marker-end="url(#a)"/>
  <path d="M880 288 880 314 600 314 600 328" fill="none" stroke="#d0d7de" stroke-width="2"/>

  <rect x="330.5" y="330.5" width="540" height="56" rx="10" fill="#dafbe1" stroke="#1a7f37" stroke-opacity="0.5"/>
  <text x="600" y="365" text-anchor="middle" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#1a7f37">The same verdict, for the same reason</text>

  <text x="600" y="410" text-anchor="middle" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#656d76">One conformance suite judges both, so a divergence between them is a bug by definition.</text>
</svg>
